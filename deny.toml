[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

# Reviewed WebAuthn implementation, used unchanged; see THIRD_PARTY_NOTICES.md.
[[licenses.exceptions]]
name = "base64urlsafedata"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "webauthn-attestation-ca"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "webauthn-rs"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "webauthn-rs-core"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "webauthn-rs-proto"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "webauthn-authenticator-rs"
version = "=0.5.5"
allow = ["MPL-2.0"]


[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
