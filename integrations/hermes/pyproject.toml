[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "charon-hermes"
version = "0.2.1"
description = "Fail-closed Charon permissions and tool receipts for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alexander Ververis" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.entry-points."hermes_agent.plugins"]
charon-hermes = "charon_hermes"

[project.scripts]
charon-hermes-admission = "charon_hermes.service:main"
charon-hermes-policy = "charon_hermes.operator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/charon_hermes"]
