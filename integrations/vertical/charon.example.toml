listen = "0.0.0.0:3129"

[realm]
id = "realm-vertical-developer"
tenant = "vertical-tenant"
persona = "vertical-developer"
generation = 1
[upstream_proxy]
url = "http://egress.example.internal:8888"
username = "egress"
password_file = "/run/credentials/egress-proxy-password"

[keepass]
database = "/var/lib/charon/vault.kdbx"

[[keepass.items]]
secret_ref = "github/vertical-developer"
persona = "vertical-developer"
# Replace with the exact disposable KeePass entry UUID.
entry_id = "00000000-0000-4000-8000-000000000001"

[admin]
listen = "0.0.0.0:8444"
origin = "https://charon.example.test:8444"
certificate = "/etc/charon/admin/fullchain.pem"
private_key = "/run/credentials/charon-admin-key.pem"
passkeys_file = "/var/lib/charon/admin/passkeys.json"

[tls]
ca_certificate = "/run/charon-ca/ca.pem"
ca_private_key = "/run/credentials/charon-ca-key.pem"

[identity]
issuer = "fixture-control-plane"
audience = "charon-integration"
# Replace with the integration issuer's Ed25519 public key. The private key
# remains outside Charon and every workload image/container.
public_key = "11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo="
max_ttl_seconds = 60
clock_skew_seconds = 2

[receipts]
journal_path = "/var/lib/charon/receipts/receipts.jsonl"
state_path = "/var/lib/charon/receipts/chain"
queue_capacity = 1024

[[capabilities]]
name = "github-read-user"
persona = "vertical-developer"
service = "github"
methods = ["GET"]
paths = ["/user"]

[[services]]
name = "github"
hosts = ["api.github.com"]
secret_ref = "github/vertical-developer"

[services.hydration]
kind = "authorization"
value_template = "token {secret}"

[services.response]
compression = "identity-only"
max_bytes = 16777216
max_duration_seconds = 60
idle_timeout_seconds = 15
max_secret_bytes = 4096

[services.response.body]
mode = "buffered-structured"
max_bytes = 1048576
forbidden_fields = ["access_token", "refresh_token", "token", "signed_url"]
