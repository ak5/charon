x-charon: &charon
  image: "${CHARON_IMAGE:?set an immutable Charon image}"
  platform: linux/amd64
  user: "${CHARON_RUNTIME_UID:?set the protected runtime owner UID}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - "/tmp:mode=1777,size=16m"
  networks:
    - workload
    - upstream
  volumes:
    - "${CHARON_CONFIG_PATH:?set the reviewed vertical config}:/etc/charon/charon.toml:ro"
    - "${CHARON_CA_CERTIFICATE_PATH:?set public CA path}:/run/charon-ca/ca.pem:ro"
    - "${CHARON_CA_PRIVATE_KEY_PATH:?set private CA key path}:/run/credentials/charon-ca-key.pem:ro"
    - "${CHARON_EGRESS_PROXY_PASSWORD_PATH:?set protected Squid password path}:/run/credentials/egress-proxy-password:ro"
    - "${CHARON_RECEIPT_STATE_PATH:?set protected receipt state directory}:/var/lib/charon/receipts"
    - "${CHARON_KDBX_PATH:?set private encrypted KDBX}:/var/lib/charon/vault.kdbx:ro"
    - "${CHARON_ADMIN_CERTIFICATE_PATH:?set browser-trusted admin certificate}:/etc/charon/admin/fullchain.pem:ro"
    - "${CHARON_ADMIN_PRIVATE_KEY_PATH:?set private admin TLS key}:/run/credentials/charon-admin-key.pem:ro"
    - "${CHARON_ADMIN_STATE_PATH:?set private admin state}:/var/lib/charon/admin"
  command: ["--config", "/etc/charon/charon.toml"]
  healthcheck:
    test: ["CMD", "/usr/local/bin/charon", "healthcheck", "http://127.0.0.1:3129/healthz"]
    interval: 2s
    timeout: 2s
    retries: 15
    start_period: 2s

services:
  charon:
    <<: *charon
    ports:
      - "${CHARON_ADMIN_BIND_IP:?set the owner-only HTTPS address}:8444:8444"

  charon-locked:
    <<: *charon
    volumes:
      - "${CHARON_CONFIG_PATH:?set the reviewed vertical config}:/etc/charon/charon.toml:ro"
      - "${CHARON_KDBX_PATH:?set private encrypted KDBX}:/var/lib/charon/vault.kdbx:ro"
      - "${CHARON_ADMIN_CERTIFICATE_PATH:?set browser-trusted admin certificate}:/etc/charon/admin/fullchain.pem:ro"
      - "${CHARON_ADMIN_PRIVATE_KEY_PATH:?set private admin TLS key}:/run/credentials/charon-admin-key.pem:ro"
      - "${CHARON_LOCKED_ADMIN_STATE_PATH:?set private locked-instance admin state}:/var/lib/charon/admin"
      - "${CHARON_CA_CERTIFICATE_PATH:?set public CA path}:/run/charon-ca/ca.pem:ro"
      - "${CHARON_CA_PRIVATE_KEY_PATH:?set private CA key path}:/run/credentials/charon-ca-key.pem:ro"
      - "${CHARON_EGRESS_PROXY_PASSWORD_PATH:?set protected Squid password path}:/run/credentials/egress-proxy-password:ro"
      - "${CHARON_LOCKED_RECEIPT_STATE_PATH:?set isolated locked receipt state}:/var/lib/charon/receipts"

  workload:
    build:
      context: .
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - "/tmp:mode=1777,size=8m"
    networks:
      - workload
    volumes:
      - "${CHARON_ROOT_CA_CERTIFICATE_PATH:?set public root CA path}:/etc/charon-ca/ca.pem:ro"
      - "${CHARON_MANIFEST_DIRECTORY:?set fresh test manifests}:/manifests:ro"

networks:
  workload:
    internal: true
  upstream: {}
