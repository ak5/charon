name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: charon-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize trusted revision
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.value }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - id: revision
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$REVISION" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#REVISION}" -eq 40
          git merge-base --is-ancestor "$REVISION" origin/main
          echo "value=$REVISION" >>"$GITHUB_OUTPUT"
      - id: image
        name: Derive fork-local image name
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$repository" >>"$GITHUB_OUTPUT"

  publish:
    name: Publish immutable image
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.authorize.outputs.revision }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ needs.authorize.outputs.image }}:sha-${{ needs.authorize.outputs.revision }}
          labels: org.opencontainers.image.revision=${{ needs.authorize.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish Charon-Hermes integration image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/hermes
          file: integrations/hermes/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ needs.authorize.outputs.image }}-hermes:sha-${{ needs.authorize.outputs.revision }}
          labels: org.opencontainers.image.revision=${{ needs.authorize.outputs.revision }}
          cache-from: type=gha,scope=charon-hermes
          cache-to: type=gha,mode=max,scope=charon-hermes
