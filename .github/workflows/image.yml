name: Image

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: image
        name: Derive fork-local image name
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$repository" >>"$GITHUB_OUTPUT"
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: mode=max
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate vertical harness scripts
        run: |
          sh -n integration/vertical/run.sh
          sh -n integration/vertical/run-in-workload.sh
          sh -n integration/vertical/prepare-linux-bw.sh
      - name: Build secretless gh workload fixture
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integration/vertical
          file: integration/vertical/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: mode=max
          sbom: true
          tags: charon-vertical-workload:test
          cache-from: type=gha,scope=vertical-workload
          cache-to: type=gha,mode=max,scope=vertical-workload
