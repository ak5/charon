name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hermes:
    name: Hermes integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - name: Check out pinned Hermes interface
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: NousResearch/hermes-agent
          ref: 3c27eb6234bf91b8ceee9e9071591b31e9b148cb
          path: .upstream/hermes-agent
      - name: Validate package metadata
        run: python -c 'import pathlib, tomllib; tomllib.loads(pathlib.Path("integrations/hermes/pyproject.toml").read_text())'
      - name: Install integration wheel through its package interface
        run: python -m pip install --no-deps ./integrations/hermes PyYAML==6.0.3
      - name: Test Hermes integration
        env:
          HERMES_SOURCE: .upstream/hermes-agent
          CHARON_HERMES_REQUIRE_ENTRYPOINT: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: integrations/hermes/src
        run: python -m unittest discover -s integrations/hermes/tests -v
      - name: Build production integration image
        run: docker build --platform linux/amd64 -f integrations/hermes/Dockerfile integrations/hermes

  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - name: Test deployment contract
        run: sh tests/deploy_redeploy.sh

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
