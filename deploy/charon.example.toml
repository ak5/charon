# Copy and customize this example in the operator-owned deployment system.
# Public GitHub workflows never receive or deploy this policy.
listen = "0.0.0.0:3129"

[realm]
id = "realm-milestone-0"
tenant = "tenant-milestone-0"
persona = "milestone-0-test"
generation = 1
[upstream_proxy]
url = "http://egress.example.internal:8888"

[keepass]
# Optional operator-only protected Password entry; never include in items.
# telegram_bot_token_entry_id = "00000000-0000-4000-8000-000000000003"
database = "/var/lib/charon/vault.kdbx"

[[keepass.items]]
secret_ref = "CHARON_TEST_CREDENTIAL"
persona = "milestone-0-test"
entry_id = "00000000-0000-4000-8000-000000000001"

[admin]
listen = "0.0.0.0:8444"
origin = "https://charon.example.test:8444"
certificate = "/etc/charon/admin/fullchain.pem"
private_key = "/run/credentials/charon-admin-key.pem"
passkeys_file = "/var/lib/charon/admin/passkeys.json"

# [admin.telegram]
# user_id = 123456789
# approval_capabilities = ["github-read-user"]

[identity]
issuer = "example-control-plane"
audience = "charon"
# RFC 8032 public test-vector key. Milestone 0 performs only negative identity
# smoke tests; a real issuer key is required before enabling signed workloads in
# this deployed policy.
public_key = "11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo="
max_ttl_seconds = 60
clock_skew_seconds = 2

[receipts]
journal_path = "/var/lib/charon/receipts/receipts.jsonl"
state_path = "/var/lib/charon/receipts/chain"
queue_capacity = 1024

[[capabilities]]
name = "github-read-user"
persona = "milestone-0-test"
service = "github-smoke-test"
methods = ["GET"]
paths = ["/user"]

# Milestone 0 is deliberately limited to a disposable credential. Replace this
# policy only after the production credential flow has been threat-modeled.
[[services]]
name = "github-smoke-test"
hosts = ["api.github.com"]
secret_ref = "CHARON_TEST_CREDENTIAL"

[services.hydration]
kind = "authorization"
value_template = "Bearer {secret}"

[services.response]
compression = "identity-only"
max_bytes = 16777216
max_duration_seconds = 60
idle_timeout_seconds = 15
max_secret_bytes = 4096

[services.response.body]
mode = "buffered-structured"
max_bytes = 1048576
forbidden_fields = ["access_token", "refresh_token", "token", "signed_url"]
