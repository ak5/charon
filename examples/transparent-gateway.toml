# Public, synthetic transparent-gateway example. Infra must route only the
# bound workload's api.example.test:443 traffic to 127.0.0.1:8443, block direct
# egress, reject UDP/QUIC, and install only the public CA certificate.
listen = "127.0.0.1:3129"

[realm]
id = "example-agent"
tenant = "example"
persona = "example-agent"
generation = 1


[tls]
ca_certificate = "/run/charon-ca/ca.pem"
ca_private_key = "/run/credentials/charon-ca-key.pem"

[keepass]
# Optional operator-only protected Password entry; never include in items.
# telegram_bot_token_entry_id = "00000000-0000-4000-8000-000000000003"
database = "/var/lib/charon/vault.kdbx"
# Optional: key_file = "/run/credentials/charon-key-file"

[[keepass.items]]
secret_ref = "CHARON_EXAMPLE_TOKEN"
persona = "example-agent"
entry_id = "00000000-0000-4000-8000-000000000001"

[admin]
listen = "0.0.0.0:8444"
origin = "https://charon.example.test:8444"
certificate = "/etc/charon/admin/fullchain.pem"
private_key = "/run/credentials/charon-admin-key.pem"
passkeys_file = "/var/lib/charon/admin/passkeys.json"

# Optional Telegram starts after owner unlock; configure its KeePass entry above.
# [admin.telegram]
# user_id = 123456789
# approval_capabilities = [] # Exact capability/route names; allow once per request.
# approval_descriptions = {} # Required public authority description for each gated name.
# Example: approval_capabilities = ["github-write"]
# approval_descriptions = { github-write = "Write GitHub issues under the configured local policy" }

[identity]
issuer = "example-control-plane"
audience = "charon"
public_key = "11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo="
max_ttl_seconds = 60
clock_skew_seconds = 2

[receipts]
journal_path = "/var/lib/charon/receipts.jsonl"
state_path = "/var/lib/charon/receipt-chain"
queue_capacity = 1024

[[capabilities]]
name = "example-api-read"
persona = "example-agent"
service = "example-api"
methods = ["GET"]
paths = ["/v1/profile"]

[[services]]
name = "example-api"
hosts = ["api.example.test"]
secret_ref = "CHARON_EXAMPLE_TOKEN"
transparent_listen = "127.0.0.1:8443"

[services.hydration]
kind = "authorization"
value_template = "Bearer {secret}"

[services.response]
compression = "identity-only"
max_bytes = 16777216
max_duration_seconds = 300
idle_timeout_seconds = 30
max_secret_bytes = 4096

[services.response.body]
mode = "structured-stream"
format = "sse"
max_record_bytes = 262144
forbidden_fields = ["access_token", "refresh_token", "token", "signed_url"]
