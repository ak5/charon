# Synthetic identifiers only. Infra owns actual paths, isolation, CA and mapping.
version = 1
workload = "hermes"
listen = "0.0.0.0:18080"
exclusive_network = true

[realm]
id = "hermes-realm"
tenant = "synthetic-tenant"
persona = "hermes"
generation = 1

[tls]
ca_certificate = "/etc/charon/ca.pem"
ca_private_key = "/run/charon/ca-key.pem"

[provider]
kind = "environment"

[receipts]
journal_path = "/var/lib/charon/gateway-receipts.jsonl"
state_path = "/var/lib/charon/gateway-receipts.chain"
queue_capacity = 1024

[[routes]]
name = "codex-oauth"
host = "auth.openai.com"
scheme = "https"
methods = ["POST"]
paths = ["/oauth/token", "/api/accounts/deviceauth/usercode", "/api/accounts/deviceauth/token"]
allow_query = true
caller_headers = ["authorization", "cookie"]
session_response_headers = ["set-cookie", "www-authenticate"]
max_request_bytes = 268435456
max_response_bytes = 1073741824
max_duration_seconds = 3600
idle_timeout_seconds = 120
[routes.mediation]
kind = "forward"

[[routes]]
name = "codex-model"
host = "chatgpt.com"
scheme = "https"
methods = ["GET", "POST"]
paths = []
allow_query = true
caller_headers = ["authorization", "cookie"]
session_response_headers = ["set-cookie", "www-authenticate"]
max_request_bytes = 268435456
max_response_bytes = 1073741824
max_duration_seconds = 3600
idle_timeout_seconds = 120
path_prefix = "/backend-api/codex/"
[routes.mediation]
kind = "forward"

