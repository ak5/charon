[tools]
rust = { version = "1.99.0", profile = "minimal", components = ["clippy", "rustfmt"] }
python = "3.12.10"
"github:EmbarkStudios/cargo-deny" = "0.20.2"

[settings]
disable_tools = []

[tasks.check]
description = "Run the complete local quality gate"
depends = ["fmt-check", "clippy", "test", "deploy-test", "deny", "hermes-check", "strict-tls-check", "pr-policy-check"]

[tasks.strict-tls-check]
description = "Prove generated CONNECT chains with Hermes Python 3.13.5 and HTTPX 0.28.1"
run = "sh tests/strict_tls.sh"

[tasks.hermes-check]
description = "Test the first-party Hermes permission and receipt integration"
env = { PYTHONDONTWRITEBYTECODE = "1", PYTHONPATH = "integrations/hermes/src" }
run = "python -m unittest discover -s integrations/hermes/tests -v"

[tasks.deploy-test]
description = "Test the fail-closed deployment and ephemeral registry auth contract"
run = "sh tests/deploy_redeploy.sh"

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Run Clippy with warnings denied"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run all tests"
run = "cargo test --all-targets --all-features"

[tasks.deny]
description = "Check dependency advisories, licenses, bans, and sources"
run = "cargo deny check"

[tasks.dev]
description = "Run Charon with the local development policy"
run = "cargo run -- --config examples/charon.dev.toml"

[tasks.browser-admin-check]
description = "Prove the HTTPS owner UI with real Chrome and a synthetic virtual passkey (Chrome and Node 22+ required)"
run = "cargo test --lib admin::tests::chrome_passkey_ui -- --ignored --nocapture"

[tasks.e2e-flow]
description = "Run connected offline two-password KeePass/admin/Telegram/proxy/API E2E (curl required)"
run = "cargo test --lib gateway::e2e::two_passwords_approval_and_restart -- --ignored --nocapture"

[tasks.e2e]
description = "Run connected credential-flow and real Chrome owner-UI E2E"
depends = ["e2e-flow", "browser-admin-check"]

[tasks.pr-policy-check]
description = "Verify the main-only pull request branch contract"
run = "sh tests/pr_path.sh"
